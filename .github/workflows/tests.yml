name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  postgres:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: dealflow_test
      DB_USERNAME: dealflow
      DB_PASSWORD: dealflow_secret
      DB_SSLMODE: prefer

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dealflow_test
          POSTGRES_USER: dealflow
          POSTGRES_PASSWORD: dealflow_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealflow -d dealflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Install application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Run the full suite on PostgreSQL
        run: vendor/bin/phpunit -c phpunit.pgsql.xml
