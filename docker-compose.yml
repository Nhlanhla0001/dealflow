services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: dealflow
            POSTGRES_USER: dealflow
            POSTGRES_PASSWORD: dealflow_secret
        ports:
            - '5432:5432'
        volumes:
            - dealflow_pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U dealflow -d dealflow']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        command: ['redis-server', '--appendonly', 'yes']
        volumes:
            - dealflow_redisdata:/data

volumes:
    dealflow_pgdata:
    dealflow_redisdata:
